# Edge reverse proxy for the production Compose stack (see
# docker-compose.prod.yml). Single entry point for the whole application:
#
#   Internet -> [this nginx, :80] -> /api/*, /health, /ready, /live -> api:4000
#                                  -> everything else               -> web:80
#
# `web:80` is a *different* nginx — apps/web/nginx.conf, baked into the web
# image — that only serves the built SPA and its client-side-routing
# fallback. This file is the one edge proxy in front of both containers; it
# is not built into any app image, it's mounted read-only by
# docker-compose.prod.yml.
#
# TLS is deliberately not terminated here — see docs/deployment.md for how
# to put this behind a TLS-terminating load balancer (the common case for a
# containerized deploy) or add a `listen 443 ssl` server block directly.

worker_processes auto;

events {
  worker_connections 1024;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  sendfile on;
  tcp_nopush on;
  keepalive_timeout 65;

  gzip on;
  gzip_comp_level 5;
  gzip_min_length 256;
  gzip_types
    text/plain text/css text/xml application/json application/javascript
    application/xml application/xml+rss image/svg+xml;

  # Real client IP/scheme through to upstream services — both apps/api
  # (`app.set("trust proxy", 1)`, already handles this) and access logs
  # here rely on it.
  log_format main '$remote_addr - [$time_local] "$request" '
                   '$status $body_bytes_sent "$http_referer" '
                   '"$http_user_agent" rt=$request_time';
  access_log /dev/stdout main;
  error_log /dev/stderr warn;

  upstream api_upstream {
    server api:4000;
    keepalive 32;
  }

  upstream web_upstream {
    server web:80;
    keepalive 16;
  }

  server {
    listen 80;
    server_name _;

    client_max_body_size 10m;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;

    # Defense-in-depth headers for the SPA response — apps/api already sets
    # its own full set via helmet(), not duplicated here.
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location /api/ {
      proxy_pass http://api_upstream;
    }

    location = /health {
      proxy_pass http://api_upstream;
    }

    location = /ready {
      proxy_pass http://api_upstream;
      access_log off;
    }

    location = /live {
      proxy_pass http://api_upstream;
      access_log off;
    }

    location / {
      proxy_pass http://web_upstream;
    }
  }
}
