# DEVELOPMENT/DEMO ONLY — adds the synthetic GPU node-agent telemetry
# simulator on top of the production topology, for running a local
# demonstration without physical GPU hardware. This is an *override* file,
# not a standalone stack: it only defines the one new service and expects
# to be composed together with docker-compose.prod.yml, which is left
# completely unmodified (the simulator never runs automatically as part of
# a real production deploy).
#
# Usage (from the repo root, with .env.prod already filled in — see
# docker-compose.prod.yml's header and README's "Demo environment"
# section):
#
#   docker compose -f docker-compose.prod.yml -f docker-compose.demo.yml \
#     --env-file .env.prod up -d --build
#
# University structure/users/GPU inventory are seeded automatically by the
# `demo-seed` service below (runs inside the `backend` network, against the
# same containerized Postgres `api` uses — see its comment). Once the stack
# is healthy, generate one pending reservation to demo the faculty-approval
# flow (see README):
#
#   pnpm --filter @gpu/api run prisma:demo-seed

services:
  # One-shot: populates university structure/users/GPU inventory (upserts,
  # safe to rerun) so the simulator's synthetic hostnames
  # (cse-gpu-node-01.muj.local, etc.) have matching GpuNode rows to attach
  # telemetry to. Deliberately runs `prisma:seed` in its own container on
  # the `backend` network, against the same DATABASE_URL the containerized
  # `api`/`postgres` use — never a host shell's local DATABASE_URL, which
  # can't even reach this Postgres (it publishes no host port). Reuses
  # docker-compose.prod.yml's `migrate` service/image rather than
  # redefining it.
  #
  # Needs the same full environment as `api`, not just DATABASE_URL like
  # `migrate`: prisma/seed.ts imports src/modules/auth/password.ts, which
  # pulls in src/config/env.ts and its full required-var contract
  # (REDIS_URL, JWT_ACCESS_SECRET, REFRESH_TOKEN_PEPPER,
  # TELEMETRY_INGEST_TOKEN) even though seeding itself never uses Redis or
  # issues a JWT.
  demo-seed:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-gpu_platform}?schema=public
      REDIS_URL: redis://redis:6379
      CORS_ORIGINS: "${PUBLIC_ORIGIN:?set PUBLIC_ORIGIN, e.g. https://gpu.example.edu}"
      JWT_ACCESS_SECRET: "${JWT_ACCESS_SECRET:?set JWT_ACCESS_SECRET — generate with openssl rand -hex 32}"
      REFRESH_TOKEN_PEPPER: "${REFRESH_TOKEN_PEPPER:?set REFRESH_TOKEN_PEPPER — generate with openssl rand -hex 32}"
      TELEMETRY_INGEST_TOKEN: "${TELEMETRY_INGEST_TOKEN:?set TELEMETRY_INGEST_TOKEN — generate with openssl rand -hex 32}"
    command: ["pnpm", "run", "prisma:seed"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    networks: [backend]

  demo-telemetry-simulator:
    build:
      context: .
      dockerfile: apps/demo-telemetry-simulator/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # Same shared secret the real API's telemetry ingestion endpoints
      # check — this simulator authenticates exactly like a physical
      # node-agent would, no bypass.
      TELEMETRY_INGEST_TOKEN: "${TELEMETRY_INGEST_TOKEN:?set TELEMETRY_INGEST_TOKEN in .env.prod — must match the api service's value}"
      # Internal service DNS name from docker-compose.prod.yml's `backend`
      # network — never a published host port.
      DEMO_SIMULATOR_API_BASE_URL: http://api:4000
      DEMO_SIMULATOR_HEARTBEAT_INTERVAL_MS: ${DEMO_SIMULATOR_HEARTBEAT_INTERVAL_MS:-10000}
      DEMO_SIMULATOR_DEPARTMENTS: ${DEMO_SIMULATOR_DEPARTMENTS:-cse,ai,ds}
      DEMO_SIMULATOR_NODES_PER_DEPARTMENT: ${DEMO_SIMULATOR_NODES_PER_DEPARTMENT:-4}
    depends_on:
      # Reuses the `api` service already defined by docker-compose.prod.yml
      # — waits for its real HEALTHCHECK (see apps/api/Dockerfile), not a
      # fixed delay.
      api:
        condition: service_healthy
      # Without this, the simulator starts posting telemetry for hostnames
      # that don't have GpuNode rows yet (`api` being healthy says nothing
      # about seed data existing), every send 404s, its own health file
      # never gets written, and the container is reported unhealthy.
      demo-seed:
        condition: service_completed_successfully
    networks: [backend]

networks:
  # Joins the same network docker-compose.prod.yml declares — Compose
  # merges same-named networks across -f files, so this is not a second,
  # disconnected network.
  backend:
